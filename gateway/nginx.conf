upstream frontend { server web:3000; }
upstream backend { server api:8000; }
server {
  listen 8080;
  # Defensive headers: no behavior change for the app, safer when hosted.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # HSTS is intentionally off: local plain-HTTP deployment. Enable with TLS.
  location /api/ {
    proxy_pass http://backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_header Set-Cookie;
  }
  location = /health {
    proxy_pass http://backend/health;
  }
  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    proxy_pass_header Set-Cookie;
  }
}
